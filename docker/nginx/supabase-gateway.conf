# ============================================================================
# Nginx gateway — makes PostgREST look like Supabase to the @supabase/* clients
# ============================================================================
# The @supabase/supabase-js client always appends /rest/v1/ (and /auth/v1/,
# /storage/v1/, etc.) to the SUPABASE_URL when calling its backend. PostgREST
# serves tables at the root (/bfi_esdd_responses), not /rest/v1/bfi_esdd_...
#
# This nginx stripping proxy translates the two URL conventions so the app
# code stays identical between cloud-Supabase and offline-PostgREST.
#
# Only /rest/v1/ is translated. Auth (/auth/v1/), Storage (/storage/v1/), and
# Edge Functions (/functions/v1/) return 501 — the offline stack does not
# implement them (evidence blobs live in bytea inside Postgres, not in
# Supabase Storage; auth flows use the app's own cookie/token layer).
# ============================================================================

server {
  listen 80 default_server;
  server_name _;

  # Preserve original body size limits for evidence uploads (10 MB cap).
  client_max_body_size 20m;

  # ---- REST → PostgREST ---------------------------------------------------
  # Strip the /rest/v1 prefix and forward to postgrest.
  # PostgREST is on the internal docker network at http://postgrest:3000.
  #
  # NOTE ON THE REWRITE PATTERN: earlier versions of this config used
  #   proxy_pass http://postgrest:3000/$1$is_args$args;
  # with a regex-capture location. That triggers nginx's runtime-resolver
  # requirement (because the URI contains a variable) and fails with
  # "no resolver defined to resolve postgrest". The rewrite+break pattern
  # below sidesteps that entirely: hostname is a literal, no variables in
  # proxy_pass, nginx caches DNS at worker startup like it's supposed to.
  location /rest/v1/ {
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass http://postgrest:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # PostgREST auth: pass through Authorization + apikey headers verbatim.
    proxy_set_header Authorization $http_authorization;
    proxy_set_header apikey $http_apikey;

    # Preserve Accept / Content-Type / Content-Profile / Prefer semantics.
    proxy_set_header Accept $http_accept;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Content-Profile $http_content_profile;
    proxy_set_header Accept-Profile $http_accept_profile;
    proxy_set_header Prefer $http_prefer;

    # Larger buffers for the wider requests / responses PostgREST sends.
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
  }

  # Bare /rest/v1 (no trailing slash / path) — return an empty OpenAPI-ish
  # payload so client health checks / discovery don't blow up.
  location = /rest/v1 {
    default_type application/json;
    return 200 '{"swagger":"2.0","info":{"title":"PostgREST via offline gateway","version":"local"},"paths":{}}';
  }

  # ---- Auth / Storage / Functions — not implemented in offline mode -------
  location ~ ^/(auth|storage|functions)/v1/ {
    default_type application/json;
    return 501 '{"error":"not_implemented","hint":"This surface is not exposed in the offline demo stack. Auth flows use the app cookie layer; evidence blobs live in bytea in postgres."}';
  }

  # ---- Root — self-describe -----------------------------------------------
  location = / {
    default_type text/plain;
    return 200 "Supabase gateway (offline).\nRoutes /rest/v1/* -> postgrest:3000/*.\nAuth/Storage/Functions return 501.\n";
  }
}
